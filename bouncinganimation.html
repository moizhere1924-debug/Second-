<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            align-content: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
        }
        ul{
            display: flex;
            align-self: center;
            justify-self: center;
            gap: 20px;
            border-bottom: 15px solid black;
        }

        li{
            width: 50px;
            height: 50px;
            background-color: cyan;
            border-radius: 50%;
            list-style: none;
            animation: bouncing 1s linear infinite  ;
        }
        @keyframes bouncing {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-100px);
            }
            100% {
                transform: translateY(0);
            }
        }
        li:nth-child(2){
            animation-delay: 0.2s;
        }
        li:nth-child(3){
            animation-delay: 0.4s;
        }
        li:nth-child(4){
            animation-delay: 0.6s;
        }
        li:nth-child(5){
            animation-delay: 0.8s;
        }

     
    </style>
</head>
<body>
    <ul>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>
    
</body>
</html>
